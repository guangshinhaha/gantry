# gantry preview smoke tests. Call it from a repo with:
#
#   jobs:
#     preview:
#       uses: guangshinhaha/gantry/.github/workflows/preview.yml@main
#       with: { platform: railway }
#       secrets: inherit
#
# Waits for the PR's preview deployment, runs Playwright @smoke tests against
# it, uploads screenshots and posts ONE sticky PR comment (updated per push).
# Optional: `lighthouse: true` adds a Lighthouse scan (scores + top failing
# audits) to the same comment; report-only unless `lighthouse-min-a11y` is set.
# Skips itself when the platform secret is missing (forks too) or the repo has
# no @smoke tests.
#
# Adding a platform: add a `Find preview URL (<platform>)` step below that
# writes `url` (and optionally `sha`) to $GITHUB_OUTPUT and fails with a
# one-line reason, then list its step id in `Resolve preview URL` and in the
# comment step's FOUND. Add any secret to the `secrets:` block and the gate.
name: gantry-preview

on:
  workflow_call:
    inputs:
      platform:
        description: Where PR previews live. "railway" or "vercel". Set by gantry-init from detection.
        type: string
        required: true
      smoke-command:
        type: string
        default: npx playwright test --grep @smoke
      timeout-minutes:
        description: How long to wait for the preview to come up on the PR head SHA
        type: number
        default: 10
      runs-on:
        type: string
        default: '"ubuntu-latest"'
      node-version:
        type: string
        default: "22"
      railway-project-id:
        description: Railway project id. Needed for account/workspace tokens; project tokens carry their own.
        type: string
        default: ""
      railway-service:
        description: Railway service name, when the project has several
        type: string
        default: ""
      lighthouse:
        description: Run a report-only Lighthouse scan on the preview after smoke passes
        type: boolean
        default: false
      lighthouse-urls:
        description: Paths to scan, space or newline separated, relative to the preview URL
        type: string
        default: /
      lighthouse-min-a11y-x:
        description: Fail the job when any scanned URL's accessibility score (0-100) is below this. Empty means report only.
        type: string
        default: ""
      gantry-ref:
        description: gantry ref for the adapter scripts
        type: string
        default: main
    secrets:
      RAILWAY_TOKEN:
        required: false
      VERCEL_AUTOMATION_BYPASS_SECRET:
        description: Vercel Deployment Protection bypass secret (only if protection is on)
        required: false

permissions:
  contents: read
  pull-requests: write
  deployments: read

jobs:
  preview:
    if: ${{ github.event.pull_request && !github.event.pull_request.draft }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40 # backstop; inputs.timeout-minutes bounds the wait
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check there is something to do
        id: gate
        env:
          PLATFORM: ${{ inputs.platform }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          case "$PLATFORM" in
            railway) [ -n "$RAILWAY_TOKEN" ] && have=1 || have=0; name=RAILWAY_TOKEN ;;
            # Vercel needs no secret to find the URL; forks need manual Vercel approval, so skip them.
            vercel) [ "$IS_FORK" = false ] && have=1 || have=0; name="a same-repo PR (fork PRs are skipped)" ;;
            *) echo "::error::Unknown platform '$PLATFORM'."; exit 1 ;;
          esac
          skip() { # reason: visible on the run page and the job summary, not only in the log
            echo "Skipped: $1"
            echo "::notice title=Preview skipped::$1"
            echo "Skipped: $1" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          }
          if [ "$have" = 0 ]; then
            skip "no $name, so preview smoke tests are off here."
          fi
          if ! grep -rqs --include='*.ts' --include='*.js' --include='*.mjs' --include='*.tsx' \
              --exclude-dir=node_modules --exclude-dir=.git '@smoke' .; then
            skip "no @smoke tests found, so preview smoke tests are off for this repo."
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # ---- URL discovery: one step per platform -------------------------
      # Contract: output `url`; optional `sha`. Must itself wait until the
      # preview serves the PR head SHA, and fail with a one-line reason.
      - name: Find preview URL (railway)
        if: steps.gate.outputs.run == 'true' && inputs.platform == 'railway'
        id: url-railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ inputs.railway-project-id }}
          RAILWAY_SERVICE: ${{ inputs.railway-service }}
          PR_NUMBER: ${{ env.PR }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
          GANTRY_REF: ${{ inputs.gantry-ref }}
        run: |
          curl -sSfL "https://raw.githubusercontent.com/guangshinhaha/gantry/${GANTRY_REF}/scripts/preview-railway.mjs" -o /tmp/preview-railway.mjs
          node /tmp/preview-railway.mjs 2>&1 | tee /tmp/preview-adapter.log
          exit "${PIPESTATUS[0]}"
      - name: Find preview URL (vercel)
        if: steps.gate.outputs.run == 'true' && inputs.platform == 'vercel'
        id: url-vercel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
          GANTRY_REF: ${{ inputs.gantry-ref }}
        run: |
          curl -sSfL "https://raw.githubusercontent.com/guangshinhaha/gantry/${GANTRY_REF}/scripts/preview-vercel.mjs" -o /tmp/preview-vercel.mjs
          node /tmp/preview-vercel.mjs 2>&1 | tee /tmp/preview-adapter.log
          exit "${PIPESTATUS[0]}"
      # ---- end URL discovery ---------------------------------------------

      - name: Resolve preview URL
        if: steps.url-railway.outcome == 'success' || steps.url-vercel.outcome == 'success'
        id: url
        env:
          URL: ${{ steps.url-railway.outputs.url || steps.url-vercel.outputs.url }}
        run: echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Wait until the URL answers 200
        if: steps.url.outcome == 'success'
        id: live
        env:
          URL: ${{ steps.url.outputs.url }}
          MINUTES: ${{ inputs.timeout-minutes }}
          # Vercel Deployment Protection bypass; empty means no header.
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          hdr=(); [ -n "$BYPASS" ] && hdr=(-H "x-vercel-protection-bypass: $BYPASS")
          end=$(( $(date +%s) + MINUTES * 60 ))
          while :; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 15 "${hdr[@]}" "$URL" || true)
            [ "$code" = 200 ] && break
            echo "waiting: $URL answered ${code:-no response}"
            if [ "$(date +%s)" -ge "$end" ]; then
              echo "Preview $URL never answered 200 (last: ${code:-no response})." > /tmp/preview-adapter.log
              exit 1
            fi
            sleep 10
          done
          echo "$URL answers 200"

      - name: Install
        if: steps.live.outcome == 'success'
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install; fi
          npx playwright install --with-deps chromium

      - name: Smoke tests
        if: steps.live.outcome == 'success'
        id: smoke
        env:
          BASE_URL: ${{ steps.url.outputs.url }}
          # Read by the repo's playwright.config (see README) to send x-vercel-protection-bypass.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SMOKE: ${{ inputs.smoke-command }}
        run: bash -c "$SMOKE"

      - name: Upload screenshots and report
        if: always() && steps.live.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: preview-smoke
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Lighthouse
        if: inputs.lighthouse && steps.smoke.outcome == 'success'
        id: lh
        continue-on-error: true
        env:
          BASE: ${{ steps.url-railway.outputs.url }}
          PATHS: ${{ inputs.lighthouse-urls }}
          MIN_A11Y: ${{ inputs.lighthouse-min-a11y }}
          GANTRY_REF: ${{ inputs.gantry-ref }}
        run: |
          curl -sSfL "https://raw.githubusercontent.com/guangshinhaha/gantry/${GANTRY_REF}/scripts/lighthouse-report.mjs" -o /tmp/lighthouse-report.mjs
          args=()
          for p in $PATHS; do args+=("--url=${BASE%/}/${p#/}"); done
          npx --yes @lhci/cli@0.16 collect --numberOfRuns=1 \
            --settings.chromeFlags="--no-sandbox --headless=new" "${args[@]}"
          node /tmp/lighthouse-report.mjs .lighthouseci /tmp/lighthouse-comment.md

      - name: Upload Lighthouse reports
        if: always() && steps.lh.outcome != 'skipped' && inputs.lighthouse
        uses: actions/upload-artifact@v4
        with:
          name: preview-lighthouse
          path: .lighthouseci/
          if-no-files-found: ignore

      - name: Comment on PR
        if: always() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.url.outputs.url }}
          FOUND: ${{ (steps.url-railway.outcome == 'failure' || steps.url-vercel.outcome == 'failure') && 'failure' || 'ok' }}
          LIVE: ${{ steps.live.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          LH: ${{ steps.lh.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason=$(tail -n 1 /tmp/preview-adapter.log 2>/dev/null || true)
          {
            echo "<!-- gantry-preview -->"
            echo "### Preview smoke tests"
            if [ "$SMOKE" = success ]; then
              echo "✅ **Passed** on [$URL]($URL) at \`${HEAD_SHA:0:7}\`."
            elif [ "$SMOKE" = failure ]; then
              echo "❌ **Smoke tests failed** on [$URL]($URL) at \`${HEAD_SHA:0:7}\`."
            elif [ "$FOUND" = failure ] || [ "$LIVE" = failure ]; then
              echo "❌ **Preview did not come up** for \`${HEAD_SHA:0:7}\`: ${reason:-see the run log}"
            else
              echo "⚠️ Cancelled or did not finish for \`${HEAD_SHA:0:7}\`."
            fi
            if [ "$LH" = success ] && [ -f /tmp/lighthouse-comment.md ]; then
              echo
              cat /tmp/lighthouse-comment.md
            elif [ "$LH" = failure ]; then
              echo
              echo "#### Lighthouse"
              echo "⚠️ The scan did not complete; see the run log."
            fi
            echo
            echo "<sub>Screenshots and report: **preview-smoke** artifact on [this run]($RUN_URL).</sub>"
          } > /tmp/preview-comment.md
          cat /tmp/preview-comment.md >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- gantry-preview -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@/tmp/preview-comment.md >/dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@/tmp/preview-comment.md >/dev/null
          fi

      - name: Enforce Lighthouse accessibility minimum
        if: always() && steps.lh.outputs.a11y_fail == 'true'
        run: |
          echo "::error::Lighthouse accessibility score is below lighthouse-min-a11y."
          exit 1
