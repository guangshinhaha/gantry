# gantry risk label. Call it from the same workflow as verdict-check, ahead of it:
#
#   jobs:
#     risk-label:
#       if: ${{ github.event_name == 'pull_request' }}
#       permissions:
#         contents: read
#         pull-requests: write
#       uses: guangshinhaha/gantry/.github/workflows/risk-label.yml@main
#     verdict-check:
#       needs: risk-label
#       if: ${{ !cancelled() }}
#       with:
#         risk-label-result: ${{ needs.risk-label.result }}
#       ...
#
# Adds the `risk:high` label to a PR that changes a High-risk path, so verdict-check
# can't be skipped because someone forgot the label. The paths are gantry's
# defaults (scripts/high-risk-paths.mjs) plus the globs in
# .github/gantry-high-risk-paths (one per line, `#` comments), read from the PR's
# BASE branch so a PR can't empty the list. It only adds the label: a label a
# person set stays, and one added here stays after the PR stops matching, until a
# person removes it. A label added with the workflow token doesn't trigger other
# runs, so verdict-check (which needs this job) reads the PR's live labels.
# A fork PR's token is read-only, and so is Dependabot's, so neither can be labelled: if
# one touches a High-risk path the job fails, so it can't pass as an unlabelled PR, unless
# a maintainer has already put the label on it. Removing the label by hand doesn't re-run
# the labelling. A PR of 3000+ files (the API's cap) is labelled, since the list may be cut short.
# The matching scripts are downloaded at `gantry-ref`, a full commit sha (default: a pinned
# one, bumped when the scripts change), never a moving ref.
name: gantry-risk-label

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: '"ubuntu-latest"'
      gantry-ref:
        description: Full commit sha of gantry for the matching scripts (a branch or tag name is refused, since it can move)
        type: string
        default: b06fd80534a5a0c73ec8bdc7f4cbeac29126b326
      label:
        description: Label to add (the one verdict-check requires)
        type: string
        default: risk:high

permissions:
  contents: read
  pull-requests: write

jobs:
  risk-label:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - name: Decide whether to run
        id: gate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          LABEL: ${{ inputs.label }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "Skipped: not a pull request" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A person just removed the label: don't add it straight back.
          if [ "$EVENT_ACTION" = "unlabeled" ] && [ "$EVENT_LABEL" = "$LABEL" ]; then
            echo "Skipped: \`$LABEL\` was removed by hand, so it is not re-added" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          # A fork's token is read-only; so is Dependabot's, even on a same-repo branch.
          if [ "$HEAD_REPO" != "$REPO" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "readonly=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }} # trusted list; PR code is never run

      - name: Add the label if a High-risk path changed
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ inputs.label }}
          GANTRY_REF: ${{ inputs.gantry-ref }}
          READONLY: ${{ steps.gate.outputs.readonly }}
        run: |
          # The scripts run with a write token, so they must come from a fixed commit.
          if ! printf '%s' "$GANTRY_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::gantry-ref must be a full 40-character commit sha, got '$GANTRY_REF'"
            exit 1
          fi
          curl -sSfL "https://raw.githubusercontent.com/guangshinhaha/gantry/${GANTRY_REF}/scripts/high-risk-paths.mjs" -o /tmp/high-risk-paths.mjs
          curl -sSfL "https://raw.githubusercontent.com/guangshinhaha/gantry/${GANTRY_REF}/scripts/risky-paths.mjs" -o /tmp/risky-paths.mjs
          # Include old names of renamed files, so moving a file out of a High-risk path is still
          # caught. Lines are tagged (N = filename, P = previous_filename) so the 3000 cap below
          # counts files, not the extra rename entries.
          gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | "N " + (.filename | gsub("\n"; " ")), (if .previous_filename then "P " + (.previous_filename | gsub("\n"; " ")) else empty end)' > /tmp/tagged.txt
          cut -c3- /tmp/tagged.txt > /tmp/changed.txt
          node /tmp/high-risk-paths.mjs .github/gantry-high-risk-paths /tmp/changed.txt > /tmp/matches.md
          if [ "$(grep -c '^N ' /tmp/tagged.txt)" -ge 3000 ]; then
            echo "- 3000+ files changed: the file list may be cut short, so labelling to be safe" > /tmp/matches.md
          fi
          if [ ! -s /tmp/matches.md ]; then
            echo "No High-risk paths touched."
            echo "No High-risk path touched: no \`$LABEL\` label added." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Labelled \`$LABEL\`"
            echo
            echo "This PR touches High-risk paths, so it needs a verifier's verdict at its head:"
            echo
            cat /tmp/matches.md
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$READONLY" = "true" ]; then
            # Read-only token: it can't label, but a maintainer may already have.
            if gh api "repos/$REPO/issues/$PR/labels" --paginate --jq '.[].name' | grep -Fxq "$LABEL"; then
              echo "Already labelled \`$LABEL\` (read-only token, so nothing to add)." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::This PR touches High-risk paths but its token is read-only (fork or Dependabot), so it cannot be labelled \`$LABEL\`. A maintainer must add the label."
            exit 1
          fi
          # Create the label only if the repo has none, so a customised one is kept. A failed
          # create is fine only if the label is there afterwards; any other failure
          # (permissions, API) fails the job.
          if ! gh label create "$LABEL" --color B60205 \
            --description "High-risk change: needs a verifier's verdict at head" -R "$REPO" 2>/tmp/label-err; then
            if ! gh label list -R "$REPO" --limit 1000 --json name --jq '.[].name' | grep -Fxq "$LABEL"; then
              cat /tmp/label-err >&2
              exit 1
            fi
          fi
          # REST, not `gh pr edit`: its GraphQL call can be refused under GITHUB_TOKEN.
          gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$LABEL" > /dev/null
