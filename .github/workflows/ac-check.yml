# gantry acceptance-criteria check. Call it from a repo with:
#
#   jobs:
#     ac-check:
#       uses: guangshinhaha/gantry/.github/workflows/ac-check.yml@main
#
# Reads Closes/Fixes/Resolves #N from the PR body. If issue N has an
# "Acceptance criteria" checklist, fails unless the PR body has that section
# with every item ticked. Skips drafts, and PRs with no such issue, and says why
# in the job summary (the draft check is a step, not a job-level `if:`, so it can).
name: gantry-ac-check

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: '"ubuntu-latest"'
      gantry-ref:
        description: gantry ref for the check script
        type: string
        default: main

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  ac-check:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - name: Decide whether to run
        id: gate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ -z "$PR_NUMBER" ]; then reason="not a pull request"
          elif [ "$DRAFT" = "true" ]; then reason="draft PR"
          else echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Skipping: $reason"
          echo "Skipped: $reason" >> "$GITHUB_STEP_SUMMARY"
          echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Check acceptance criteria
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          curl -sSfL "https://raw.githubusercontent.com/guangshinhaha/gantry/${{ inputs.gantry-ref }}/scripts/ac-check.mjs" -o /tmp/ac-check.mjs
          node /tmp/ac-check.mjs
