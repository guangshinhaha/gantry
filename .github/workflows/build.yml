# gantry Docker build-and-verify. Call it from a repo with:
#
#   jobs:
#     build:
#       uses: guangshinhaha/gantry/.github/workflows/build.yml@main
#       permissions:
#         contents: read
#
# PRs and main: build the Dockerfile with the GHA cache. Never pushes.
# GovPaaS (Northflank), Railway and Vercel build the image themselves; only
# AWS apps push to ECR. A registry push may return later as an opt-in.
# Skips itself, with a visible reason, when the repo has no Dockerfile.
#
# Opt-in smoke test (off unless run-image is true): loads the built image, runs
# it, waits for health-path to answer 2xx, then checks every line of `probes`
# ("<path> [expected status]", status defaults to 200). A failed probe fails the
# job and the error names it, e.g. "GET /missing.js expected 404, got 200".
#   with:
#     run-image: true
#     port: 3000                 # the port the container listens on
#     health-path: /health
#     probes: |
#       / 200
#       /missing.js 404
name: gantry-build

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: '"ubuntu-latest"'
      context:
        type: string
        default: "."
      file:
        description: Dockerfile path (default <context>/Dockerfile)
        type: string
        default: ""
      platforms:
        type: string
        default: linux/amd64
      run-image:
        description: Opt in. Run the built image and probe it (needs a single platform)
        type: boolean
        default: false
      port:
        description: Port the container listens on (run-image only). Also passed to it as PORT
        type: string
        default: "3000"
      health-path:
        description: Path that answers 2xx once the app is up (run-image only)
        type: string
        default: /health
      probes:
        description: Extra probes, one per line, "<path> [expected status]" (run-image only)
        type: string
        default: ""
      health-timeout:
        description: Seconds to wait for health-path (run-image only)
        type: number
        default: 60

permissions:
  contents: read

jobs:
  detect:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    outputs:
      has-dockerfile: ${{ steps.find.outputs.found }}
      file: ${{ steps.find.outputs.file }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        env:
          CONTEXT: ${{ inputs.context }}
          FILE: ${{ inputs.file }}
        run: |
          f="${FILE:-$CONTEXT/Dockerfile}"
          if [ -f "$f" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "file=$f" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped: no Dockerfile ($f not found), Docker build is off for this repo."
            echo "::notice title=Docker build skipped::no Dockerfile ($f not found)"
            echo "Skipped: no Dockerfile ($f not found)" >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

  # Build only, on PRs and on main. No registry login, no packages permission.
  build:
    needs: detect
    if: needs.detect.outputs.has-dockerfile == 'true'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check smoke-test inputs
        if: inputs.run-image
        env:
          PLATFORMS: ${{ inputs.platforms }}
          PORT: ${{ inputs.port }}
          HEALTH_PATH: ${{ inputs.health-path }}
          PROBES: ${{ inputs.probes }}
        run: |
          fail=0
          bad() { echo "::error title=Smoke test input::$1"; fail=1; }
          case "$PLATFORMS" in
            *,*) bad "run-image loads the image into Docker, which takes a single platform; got '$PLATFORMS'." ;;
          esac
          case "$PORT" in ""|*[!0-9]*) bad "port must be a number; got '$PORT'." ;; esac
          case "$HEALTH_PATH" in /*) ;; *) bad "health-path must start with /; got '$HEALTH_PATH'." ;; esac
          printf '%s\n' "$PROBES" | while read -r path want _; do
            case "$path" in ""|"#"*) continue ;; esac
            case "$path" in /*) ;; *) echo "probes: the path must start with /; got '$path'." ;; esac
            case "${want:-200}" in [1-5][0-9][0-9]) ;; *) echo "probes: '$path' has status '$want', which is not an HTTP status." ;; esac
          done > "$RUNNER_TEMP/probe-errors"
          while read -r line; do bad "$line"; done < "$RUNNER_TEMP/probe-errors"
          exit "$fail"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ needs.detect.outputs.file }}
          platforms: ${{ inputs.platforms }}
          push: false
          load: ${{ inputs.run-image }}
          tags: ${{ inputs.run-image && format('gantry-smoke:{0}-{1}', github.run_id, github.run_attempt) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Opt-in smoke test. Reads each probe's status with curl, keeps going after
      # a failure so one run lists every failed probe, and fails at the end.
      - name: Smoke test
        if: inputs.run-image
        env:
          PORT: ${{ inputs.port }}
          HEALTH_PATH: ${{ inputs.health-path }}
          PROBES: ${{ inputs.probes }}
          TIMEOUT: ${{ inputs.health-timeout }}
          NAME: gantry-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          IMAGE: gantry-smoke:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker run -d --name "$NAME" -e PORT="$PORT" -p "$PORT:$PORT" "$IMAGE"
          base="http://localhost:$PORT"
          fail=0
          report() { echo "::error title=Smoke probe failed::$1"; echo "Smoke probe failed: $1" >> "$GITHUB_STEP_SUMMARY"; fail=1; }
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$base$1" || true; }

          # Health: 2xx within TIMEOUT seconds, and the container still running.
          deadline=$(( $(date +%s) + TIMEOUT ))
          healthy=false
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if [ "$(docker inspect -f '{{.State.Running}}' "$NAME")" != true ]; then break; fi
            c=$(code "$HEALTH_PATH")
            case "$c" in 2??) healthy=true; break ;; esac
            sleep 2
          done
          if [ "$healthy" = true ]; then
            echo "Smoke probe passed: GET $HEALTH_PATH (health)" >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "$(docker inspect -f '{{.State.Running}}' "$NAME")" != true ]; then
              report "health GET $HEALTH_PATH: the container exited before it answered"
            else
              report "health GET $HEALTH_PATH: no 2xx within ${TIMEOUT}s (last status ${c:-none})"
            fi
            docker logs "$NAME" 2>&1 | tail -50
            exit 1
          fi

          # Extra probes: "<path> [expected status]", blank lines and # comments skipped.
          list=$(mktemp)
          printf '%s\n' "$PROBES" | while read -r path want _; do
            case "$path" in ""|"#"*) continue ;; esac
            echo "$path ${want:-200}"
          done > "$list"
          while read -r path want; do
            got=$(code "$path")
            if [ "$got" = "$want" ]; then
              echo "Smoke probe passed: GET $path -> $got" >> "$GITHUB_STEP_SUMMARY"
            else
              [ "$got" != 000 ] || got="no response"
              report "GET $path expected $want, got $got"
            fi
          done < "$list"
          [ "$fail" = 0 ] || { docker logs "$NAME" 2>&1 | tail -50; exit 1; }

      - name: Stop the smoke-test container
        if: always() && inputs.run-image
        run: docker rm -f "gantry-smoke-${{ github.run_id }}-${{ github.run_attempt }}" || true
