# gantry verdict check. Call it from a repo with:
#
#   on:
#     pull_request:
#       types: [opened, reopened, synchronize, labeled, unlabeled]
#     issue_comment:
#       types: [created, edited, deleted]
#   jobs:
#     verdict-check:
#       permissions:
#         actions: write
#         contents: read
#         issues: read
#         pull-requests: read
#       uses: guangshinhaha/gantry/.github/workflows/verdict-check.yml@main
#       # with:
#       #   label: risk:high   # the label that marks a high-risk PR
#
# Opt-in. A PR carrying the label fails unless a PR comment holds a verifier's
# verdict {pr, head_sha, verdict, evidence} with verdict PASS or PASS+NOTES and
# head_sha equal to the PR's current head, and no FAIL verdict for that head is
# newer. A push moves the head, so it needs a new verdict. A PR without the
# label skips. Only comments from OWNER, MEMBER or COLLABORATOR count, so a
# stranger cannot post a PASS. It does not judge whether a verdict is right.
#
# A verdict comment (posted, edited or deleted) re-runs the PR's runs at its head of
# the calling workflow, so the check turns green or red without a manual
# re-run. The comment event runs on the default branch, which is why the caller
# must be on the default branch, and why it needs actions: write. Until the
# re-run starts (seconds), the check still shows its earlier result.
name: gantry-verdict-check

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: '"ubuntu-latest"'
      gantry-ref:
        description: gantry ref for the check script
        type: string
        default: main
      label:
        description: PR label that marks a high-risk PR
        type: string
        default: risk:high
      trusted-associations:
        description: Comma-separated author_association values whose verdict comments count
        type: string
        default: OWNER,MEMBER,COLLABORATOR

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verdict-check:
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, inputs.label) }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - name: Require a verdict at head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ inputs.label }}
          TRUSTED: ${{ inputs.trusted-associations }}
          GANTRY_REF: ${{ inputs.gantry-ref }}
        run: |
          curl -sSfL "https://raw.githubusercontent.com/guangshinhaha/gantry/${GANTRY_REF}/scripts/verdict-check.mjs" -o /tmp/verdict-check.mjs
          node /tmp/verdict-check.mjs

  # A comment run can't report the check itself: it runs on the default branch,
  # and the required check sits on the PR's head. It re-runs the PR's run instead.
  # The `verdict` filter skips ordinary comments; an edit is matched on the old
  # body too, so editing a verdict into prose re-runs. The association test here
  # only keeps strangers' comments off a runner (a substring match, so loose); the
  # script re-checks it exactly. The comment body never reaches a shell. One
  # re-run per PR at a time: a later comment waits, then re-reads every comment.
  rerun:
    if: >-
      ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(inputs.trusted-associations, github.event.comment.author_association) &&
      (contains(github.event.comment.body, 'verdict') || contains(github.event.changes.body.from, 'verdict')) }}
    concurrency:
      group: verdict-rerun-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - name: Re-run the PR's verdict check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          ASSOC: ${{ github.event.comment.author_association }}
          TRUSTED: ${{ inputs.trusted-associations }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GANTRY_REF: ${{ inputs.gantry-ref }}
        run: |
          curl -sSfL "https://raw.githubusercontent.com/guangshinhaha/gantry/${GANTRY_REF}/scripts/verdict-rerun.mjs" -o /tmp/verdict-rerun.mjs
          node /tmp/verdict-rerun.mjs
