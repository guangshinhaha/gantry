# CI for gantry's own PRs. Every other workflow here is workflow_call, so without
# this one a broken workflow or script reaches the repos that call gantry at @main
# before anything runs it. gantry-init copies from template/, not from here, so
# this file stays in gantry.
name: gantry-own-ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  own-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install actionlint
        run: |
          version=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          tarball="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${tarball}"
          echo "$sha256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Lints the template workflows too, because gantry-init copies them into
      # other repos. shellcheck's info-level style notes don't fail the check:
      # mutation.yml has two already, and they aren't breakage. actionlint skips
      # shellcheck silently if it's missing, so fail here instead.
      - name: actionlint
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: |
          shellcheck --version
          shopt -s nullglob
          actionlint .github/workflows/*.{yml,yaml} template/.github/workflows/*.{yml,yaml}

      # Runs even when an earlier check fails, so one push shows every result.
      # node --test alone misses a syntax error in code the tests don't reach:
      # preview.yml fetches scripts no test imports, and sh parses gantry-init as
      # it runs, so an error past where the tests stop goes unnoticed.
      - name: Script syntax
        if: ${{ !cancelled() }}
        run: |
          sh -n bin/gantry-init
          sh -n bin/gantry-protect
          for f in scripts/*.mjs bin/*.mjs; do node --check "$f"; done

      - name: node --test
        if: ${{ !cancelled() }}
        run: node --test
