# CI for gantry's own PRs. Every other workflow here is workflow_call, so without
# this one a broken workflow or script reaches the repos that call gantry at @main
# before anything runs it. gantry-init copies from template/, not from here, so
# this file stays in gantry.
name: gantry-own-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  own-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned: the hook YAML check below depends on lefthook rejecting duplicate keys.
      - name: Install lefthook
        run: |
          npm install --global lefthook@2.2.2
          lefthook version

      - name: Install actionlint
        run: |
          version=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          tarball="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${tarball}"
          echo "$sha256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Template workflows are linted in "Template caller inputs" below.
      # shellcheck's info-level style notes don't fail the check:
      # mutation.yml has two already, and they aren't breakage. actionlint skips
      # shellcheck silently if it's missing, so fail here instead.
      - name: actionlint
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: |
          shellcheck --version
          shopt -s nullglob
          actionlint .github/workflows/*.{yml,yaml}

      # Lints the template workflows, which gantry-init copies into other repos.
      # Repos call the shared workflows at @main, so an input dropped or renamed
      # there breaks every repo whose template/ caller still passes it.
      - name: Template caller inputs
        if: ${{ !cancelled() }}
        run: sh scripts/lint-template-calls.sh

      # lefthook reads hooks/*.yml from gantry@main in every repo, and
      # gantry-init copies template/lefthook.yml. lefthook itself validates
      # them: yq accepts duplicate keys, lefthook rejects them.
      - name: Hook YAML parses
        if: ${{ !cancelled() }}
        run: sh scripts/lint-hooks.sh

      # Runs even when an earlier check fails, so one push shows every result.
      # node --test alone misses a syntax error in code the tests don't reach:
      # preview.yml fetches scripts no test imports, and sh parses gantry-init as
      # it runs, so an error past where the tests stop goes unnoticed.
      - name: Script syntax
        if: ${{ !cancelled() }}
        run: |
          sh -n bin/gantry-init
          sh -n bin/gantry-protect
          sh -n scripts/lint-template-calls.sh
          sh -n scripts/lint-hooks.sh
          for f in scripts/*.mjs bin/*.mjs; do node --check "$f"; done

      - name: node --test
        if: ${{ !cancelled() }}
        run: node --test

      # risk-label downloads its matching scripts at a pinned sha. A PR that edits
      # them can't know its own sha, so this checks after merge and flags a stale pin.
      - name: risk-label pin is current
        if: ${{ github.event_name == 'push' && !cancelled() }}
        run: node scripts/check-risk-label-pin.mjs
