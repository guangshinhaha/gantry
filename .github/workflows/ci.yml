# gantry reusable CI. Call it from a repo with:
#
#   jobs:
#     gantry:
#       uses: guangshinhaha/gantry/.github/workflows/ci.yml@main
#
# Same checks as the local hooks, but they run on the server, so neither
# `--no-verify` nor Claude can skip them.
name: gantry-ci

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'JSON runner label, e.g. "ubuntu-latest" or ["self-hosted","gantry"]'
        type: string
        default: '"ubuntu-latest"'
      node-version:
        type: string
        default: "22"
      e2e:
        description: Run `test:e2e` (Playwright)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides whether the real jobs run. Skips when (a) the push to main is a
  # merged PR, whose CI already ran on the pull_request event, or (b) the change
  # only touches docs. Skipping happens here, not via workflow-level
  # paths-ignore: a required check whose workflow never starts stays "pending"
  # forever, but a skipped job still lets ci-ok report success.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          skip=false
          if [ "$EVENT" = push ]; then
            merged=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              --jq '[.[] | select(.merged_at != null)] | length')
            if [ "$merged" -gt 0 ]; then skip=true; echo "Already tested in its PR."; fi
          fi
          if [ "$skip" = false ]; then
            files=""
            if [ "$EVENT" = pull_request ]; then
              files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
            elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
              files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename') || files=""
            fi
            # Docs-only = at least one file and every file is docs/** or *.md.
            other=$(printf '%s\n' "$files" | grep -vE '^docs/|\.md$' || true)
            if [ -n "$files" ] && [ -z "$other" ]; then
              skip=true; echo "Docs-only change, skipping checks."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  secrets:
    needs: gate
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.skip != 'true' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          if ! command -v gitleaks >/dev/null; then
            curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
              | tar -xz -C /tmp gitleaks
            export PATH="/tmp:$PATH"
          fi
          gitleaks detect --redact --verbose

  node:
    # Node/TS repos only: callers without package.json should not call this job.
    needs: gate
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.skip != 'true' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          else echo "pm=npm" >> "$GITHUB_OUTPUT"; fi

      - if: steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.pm }}

      - name: Install
        run: |
          if [ "${{ steps.pm.outputs.pm }}" = pnpm ]; then pnpm install --frozen-lockfile
          else npm ci; fi

      - name: Lint
        run: ${{ steps.pm.outputs.pm }} run --if-present lint

      - name: Typecheck
        run: |
          if [ -f tsconfig.json ]; then npx tsc --noEmit; else echo "no tsconfig.json, skipped"; fi

      - name: Unit tests
        run: ${{ steps.pm.outputs.pm }} run --if-present test

      - name: Dependency audit (high+)
        run: |
          if [ "${{ steps.pm.outputs.pm }}" = pnpm ]; then pnpm audit --audit-level high --prod
          else npm audit --audit-level=high --omit=dev; fi

      - name: E2E
        if: ${{ inputs.e2e }}
        run: |
          npx playwright install --with-deps chromium
          ${{ steps.pm.outputs.pm }} run test:e2e

  # Single required status check: shows up in callers as `gantry / ci-ok`.
  # Fails if any job failed or was cancelled; success and skipped both pass.
  ci-ok:
    needs: [gate, secrets, node]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job ended as $r"; exit 1 ;;
            esac
          done
