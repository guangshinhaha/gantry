# gantry reusable CI. Call it from a repo with:
#
#   jobs:
#     gantry:
#       uses: guangshinhaha/gantry/.github/workflows/ci.yml@main
#
# Same checks as the local hooks, but they run on the server, so neither
# `--no-verify` nor Claude can skip them.
name: gantry-ci

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'JSON runner label, e.g. "ubuntu-latest" or ["self-hosted","gantry"]'
        type: string
        default: '"ubuntu-latest"'
      node-version:
        type: string
        default: "22"
      e2e:
        description: Run `test:e2e` (Playwright)
        type: boolean
        default: false
      node:
        description: Set to false to turn the node job off, for a repo whose own workflow runs its tests
        type: boolean
        default: true
      codegen-command:
        description: 'Command that regenerates committed generated files (e.g. "pnpm prisma generate", "make generate"). The node job runs it after install and fails if it changes any file git tracks or adds one. Empty skips the check.'
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides which real jobs run. A push that is a merged PR skips them all, but
  # only if the PR merged into the pushed branch and its head had a green ci-ok
  # (gantry#63, #64); otherwise its CI proves nothing about this push. A change that only
  # touches docs skips everything except the secret scan, because a key can be
  # pasted into a doc. "Only docs" means *.md and docs or images under docs/,
  # counting both names of a rename, and never a file list the API may have cut
  # off (gantry#59, #60, #61, #62). The node job also skips when the caller sets `node: false`
  # or the repo has no package.json, and the reason goes in this job's summary.
  # A package.json only in a subfolder fails the node job instead (gantry#66).
  # Skipping happens here, not via workflow-level paths-ignore: a required check
  # whose workflow never starts stays "pending" forever, but a skipped job still
  # lets ci-ok report success.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merged_pr: ${{ steps.check.outputs.merged_pr }}
      run_node: ${{ steps.check.outputs.run_node }}
      node_error: ${{ steps.check.outputs.node_error }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PUSHED_REF: ${{ github.ref }}
          NODE_INPUT: ${{ inputs.node }}
          HAS_CODEGEN: ${{ inputs.codegen-command != '' }}
        run: |
          merged_pr=false
          docs_only=false
          if [ "$EVENT" = push ]; then
            # Skip only on proof the checks already passed: a PR that merged
            # into this very branch (gantry#63) and whose head had a green
            # ci-ok (gantry#64). A PR merged into another branch says nothing
            # about this push, and a re-run of a red push must stay red. Every
            # ci-ok at the head must be green, so a lookalike job can't outvote
            # a red one. Any
            # doubt, such as an API error or a caller token that can't read
            # checks, runs the checks instead.
            heads=$(gh api "repos/$REPO/commits/$SHA/pulls?per_page=100" \
              --jq '.[] | select(.merged_at != null and ("refs/heads/" + .base.ref) == env.PUSHED_REF) | .head.sha') || heads=""
            for head in $heads; do
              green=$(gh api "repos/$REPO/commits/$head/check-runs?filter=latest&per_page=100" \
                --jq '[.check_runs[] | select(.app.slug == "github-actions" and (.name | test("(^| / )ci-ok$")))] | if length > 0 and all(.[]; .conclusion == "success") then 1 else 0 end' 2>/dev/null) || green=0
              if [ "${green:-0}" -gt 0 ]; then merged_pr=true; echo "Already tested in its PR (ci-ok was green at ${head:0:7})."; break; fi
            done
            if [ "$merged_pr" = false ] && [ -n "$heads" ]; then
              echo "A PR merged into this branch, but none had a green ci-ok at its head, so the checks run."
            fi
          fi
          if [ "$merged_pr" = false ]; then
            # `files` holds every path the change touches that the API listed,
            # and `complete` says whether that is all of them. An incomplete
            # list is never docs-only. A rename lists both names: one JSON line
            # per file carries filename and previous_filename, and the line
            # count is the file count.
            files=""
            complete=false
            if [ "$EVENT" = pull_request ]; then
              entries=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
                --jq '.[] | {f: .filename, p: .previous_filename} | @json')
              changed=$(gh api "repos/$REPO/pulls/$PR" --jq .changed_files)
              listed=$(printf '%s\n' "$entries" | grep -c . || true)
              # The files API stops at 3000, so a shorter list than the PR's
              # changed_files hides the rest (gantry#61).
              files=$(printf '%s\n' "$entries" | jq -r '.f, (.p // empty)')
              if [[ "$changed" =~ ^[0-9]+$ ]] && [ "$listed" -ge "$changed" ]; then
                complete=true
              else
                echo "Changed-file list is incomplete ($listed of ${changed:-unknown}), so this is not treated as docs-only."
              fi
            elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
              cmp=$(gh api "repos/$REPO/compare/$BEFORE...$SHA") || cmp=""
              entries=$(printf '%s' "$cmp" | jq -r '.files[]? | {f: .filename, p: .previous_filename} | @json') || entries=""
              cmp_status=$(printf '%s' "$cmp" | jq -r '.status // empty' 2>/dev/null) || cmp_status=""
              listed=$(printf '%s\n' "$entries" | grep -c . || true)
              # The compare API lists at most 300 files and has no next page, so
              # a full list may be cut off (gantry#62).
              files=$(printf '%s\n' "$entries" | jq -r '.f, (.p // empty)')
              # compare runs from the merge base, so after a force-push it lists
              # only the commits since the fork and not the code both sides share.
              # Only a fast-forward (BEFORE is an ancestor of SHA) is a complete
              # list of what the push changed (gantry#90).
              if [ "$cmp_status" != ahead ]; then
                echo "Push is not a fast-forward of ${BEFORE:0:7} (compare says: ${cmp_status:-unknown}), so this is not treated as docs-only."
              elif [ "$listed" -lt 300 ]; then
                complete=true
              else
                echo "Compare lists $listed files, the API's cap, so this is not treated as docs-only."
              fi
            fi
            # Docs-only = at least one file, and every file is a *.md or a doc
            # or image under docs/. Anything else under docs/ counts as code
            # (gantry#60): a script, template or sample there may be imported
            # or run, and a list of code types always misses some. A *.md still
            # counts as docs wherever it sits.
            docfile='\.(png|jpe?g|gif|webp|svg|ico|pdf|txt|rst|adoc|markdown)$'
            other=$({ printf '%s\n' "$files" | grep -vE '^docs/|\.md$'
                      printf '%s\n' "$files" | grep -E '^docs/' | grep -vE '\.md$' | grep -vE "$docfile"
                    } || true)
            if [ "$complete" = true ] && [ -n "$files" ] && [ -z "$other" ]; then
              docs_only=true; echo "Docs-only change, running only the secret scan."
            fi
          fi
          run_node=false
          if [ "$merged_pr" = false ] && [ "$docs_only" = false ]; then
            skip_reason=""
            node_error=""
            if [ "$NODE_INPUT" != true ]; then
              skip_reason="the caller set node: false"
            elif ! err=$(gh api "repos/$REPO/contents/package.json?ref=$SHA" --silent 2>&1); then
              # Only a missing file skips. Any other error, such as an API outage,
              # fails this job so ci-ok can't go green without the checks.
              case "$err" in
                *"Not Found (HTTP 404)"*) skip_reason="no package.json in this repo" ;;
                *) echo "::error::could not check for package.json: $err"; exit 1 ;;
              esac
              # No root package.json. A nested one means a Node project the job
              # can't run, so fail node instead of skipping it (gantry#66).
              # Also checks the body is a tree: the step has no pipefail, so a
              # jq error below would otherwise read as "no package.json".
              if ! tree=$(gh api "repos/$REPO/git/trees/$SHA?recursive=1") \
                || ! printf '%s' "$tree" | jq -e '.tree | type == "array"' >/dev/null 2>&1; then
                echo "::error::could not list the repo's files to look for a nested package.json"; exit 1
              fi
              if [ "$(printf '%s' "$tree" | jq -r .truncated)" = true ]; then
                # Too many files for the API. A shallow fetch without file
                # contents lists every path in a few seconds.
                dir="$RUNNER_TEMP/gantry-tree"
                if ! { git init -q "$dir" \
                  && git -C "$dir" fetch -q --depth 1 --filter=blob:none \
                    "https://x-access-token:$GH_TOKEN@${GITHUB_SERVER_URL#https://}/$REPO" "$SHA" \
                  && git -C "$dir" ls-tree -r --name-only FETCH_HEAD > "$dir.paths"; }; then
                  echo "::error::could not list the repo's files to look for a nested package.json"; exit 1
                fi
                # git quotes and escapes any name with a quote, newline or
                # non-ASCII byte, so each line is one ASCII name and a newline
                # can't fake a match. LC_ALL=C -a: never "binary file matches".
                found=$(LC_ALL=C grep -a -E '(^"?|/)package\.json"?$' "$dir.paths" || true)
              else
                found=$(printf '%s' "$tree" \
                  | jq -r '.tree[] | select(.type == "blob") | .path | select(. == "package.json" or endswith("/package.json"))')
              fi
              nested=$(printf '%s\n' "$found" | head -n 5 | paste -sd ' ' -)
              # Asks jq, not the flattened list, so a name with a newline in it
              # can't fake a line.
              if [ -n "$(printf '%s\n' "$entries" | jq -r 'select(.f == "package.json" or .p == "package.json") | "y"')" ]; then
                # The file list names the root package.json, and the head has
                # none, so this change removed it or renamed it away. That
                # isn't a repo that never had one (gantry#59).
                node_error="this change removes or renames the root package.json, so the node job has nothing to run. Restore it, or set \`node: false\` if the project is leaving Node."
              elif [ -n "$nested" ]; then
                node_error="package.json is not at the repo root but was found at: $nested. gantry's node job only runs at the repo root. Move the project to the root, or set \`node: false\` and run its checks in your own workflow."
              fi
            fi
            if [ -n "$node_error" ]; then
              echo "Node checks failed: $node_error" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$node_error"
            elif [ -z "$skip_reason" ]; then
              run_node=true
            else
              # codegen-command runs inside the node job, so say it didn't run.
              if [ "$HAS_CODEGEN" = true ]; then skip_reason="$skip_reason, so codegen-command did not run"; fi
              echo "Node checks skipped: $skip_reason" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::Node checks skipped: $skip_reason"
            fi
          fi
          echo "merged_pr=$merged_pr" >> "$GITHUB_OUTPUT"
          echo "run_node=$run_node" >> "$GITHUB_OUTPUT"
          echo "node_error=${node_error:-}" >> "$GITHUB_OUTPUT"

  secrets:
    needs: gate
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.merged_pr != 'true' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      # Full history, so the range below has both ends. It also fetches every
      # branch, which is why the scan must name a range (gantry#36).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Downloads the gitleaks build for this runner's OS and arch and checks it
      # against a pinned sha256 (gantry#67). A gitleaks already on PATH is used
      # instead, and the log says so: a self-hosted runner may install its own,
      # and that's the only way to scan on a platform with no build here. Any
      # other platform fails with "unsupported platform", never a leak. bash, not
      # the default pwsh on Windows, so a Windows runner reaches that message.
      # secrets-scan.yml has a copy of this step, and a test keeps them the same.
      - name: Install gitleaks
        shell: bash
        run: |
          if command -v gitleaks >/dev/null; then
            echo "::notice::Using gitleaks already on PATH ($(command -v gitleaks), $(gitleaks version 2>/dev/null || echo 'version unknown')) instead of downloading v8.30.1"
          else
            version=8.30.1
            case "$RUNNER_OS/$RUNNER_ARCH" in
              Linux/X64)   platform=linux_x64;   sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
              Linux/ARM64) platform=linux_arm64; sha256=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
              macOS/X64)   platform=darwin_x64;  sha256=dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709 ;;
              macOS/ARM64) platform=darwin_arm64; sha256=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
              *)
                echo "::error::Secret scan not run: unsupported platform: $RUNNER_OS/$RUNNER_ARCH. gantry downloads gitleaks for Linux and macOS on X64 and ARM64 only; install gitleaks on this runner's PATH to scan here."
                exit 1 ;;
            esac
            dir=$(mktemp -d "${RUNNER_TEMP:-/tmp}/gitleaks.XXXXXX")
            tarball="gitleaks_${version}_${platform}.tar.gz"
            curl -sSfL -o "$dir/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
            if command -v sha256sum >/dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
            echo "$sha256  $dir/$tarball" | $sum -c -
            tar -xzf "$dir/$tarball" -C "$dir" gitleaks
            echo "$dir" >> "$GITHUB_PATH"
          fi
      # Scans only the commits this run adds, never other branches or history
      # already on the base branch (gantry#36). Those are secrets-scan.yml's
      # job: a daily scan of every branch that alerts without blocking a PR.
      #   pull_request: the PR's own commits. The merge ref's first parent is
      #     the base it merged into, so a stale base.sha can't widen the range.
      #   push: the pushed commits. A new branch, or a `before` this clone
      #     doesn't have, scans the pushed commit's whole history instead.
      #   any other event: the checked-out commit's whole history.
      # Merge commits are scanned for what they changed relative to their
      # parents' automatic merge (--diff-merges=remerge), so a key added while
      # resolving a conflict, or in an evil merge, is seen, and a clean merge
      # adds nothing (gantry#69, #84). --text makes git diff a file even when
      # it looks binary (a NUL byte, or `-diff`), which would hide it from
      # gitleaks. That needs git 2.40, which also sets GIT_ATTR_SOURCE: the
      # scan reads the base's .gitattributes (gantry#84).
      # --text costs time on a PR that adds big binaries (27s for 54MB in the
      # case behind gantry#104). That is kept on purpose: skipping binary
      # extensions or capping size would let a key hide in a file named x.zip
      # or padded past the cap, and no extension or size check tells a real
      # archive from a fake one.
      # A PR can't loosen the scan for itself (gantry#68, #84): it runs with the
      # base's .gitleaks.toml and .gitleaksignore (the default rules if the base
      # has none), never the PR's, and `gitleaks:allow` comments are ignored. A PR that touches either file, or adds a
      # line with `gitleaks:allow`, fails this step until a person with write
      # access (admin, maintain or write permission, read from the API, not the
      # review's author_association) other than the PR's author approves it at
      # its current head and the job is re-run. If the approval lookup itself
      # fails, the step fails with that error and the same message. Once approved, the PR's own config and ignore file
      # apply, which is how a real false positive gets allowlisted.
      - name: gitleaks
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          read -r git_major git_minor <<< "$(git version | sed -E 's/[^0-9]*([0-9]+)\.([0-9]+).*/\1 \2/')"
          if [ "$git_major" -lt 2 ] || { [ "$git_major" -eq 2 ] && [ "$git_minor" -lt 40 ]; }; then
            echo "::error::Secret scan not run: git $git_major.$git_minor is too old. The scan needs git 2.40 or newer to read merge commits and the base's .gitattributes."
            exit 1
          fi
          scan=(--redact --verbose)
          pr=false
          if [ "$EVENT" = pull_request ] && [ -n "$PR_HEAD" ]; then
            pr=true
            base=$PR_BASE
            if [ "$(git rev-parse -q --verify 'HEAD^2' || true)" = "$PR_HEAD" ]; then
              base=$(git rev-parse 'HEAD^1')
            fi
            range="$base..$PR_HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          else
            range=HEAD
          fi
          count=$(git rev-list --count "$range")
          echo "Secret scan: $count commit(s) in $range" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

          reasons=()
          src=$PWD
          run_dir=$PWD
          if [ "$pr" = true ]; then
            export GIT_ATTR_SOURCE=$base
            changed=$(git log --no-renames --name-only --format= --diff-merges=remerge "$range" \
              | grep -E '(^|/)\.gitleaks(\.toml|ignore)$' | sort -u || true)
            allowed=$(git log -p -U0 --format= --diff-merges=remerge "$range" \
              | awk '/^\+\+\+ /{f=substr($0,7); next} /^\+/ && index($0,"gitleaks:allow"){print f}' | sort -u)
            if [ -n "$changed" ]; then reasons+=("changes the scan's config ($(echo $changed))"); fi
            if [ -n "$allowed" ]; then reasons+=("adds gitleaks:allow ($(echo $allowed))"); fi
            approvers=""
            lookup_error=""
            if [ "${#reasons[@]}" -gt 0 ]; then
              # Who approved at the head: each reviewer's latest approving
              # review. Whether they may clear the gate is their actual
              # permission on the repo, not author_association: in an org repo
              # a read-only member or collaborator has that association too.
              errf=$(mktemp "${RUNNER_TEMP:-/tmp}/gh-err.XXXXXX")
              if ! reviews=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate 2>"$errf"); then
                lookup_error="could not read the PR's reviews: $(tr '\n' ' ' < "$errf")"
              elif ! candidates=$(printf '%s' "$reviews" | jq -rs --arg head "$PR_HEAD" --arg author "$PR_AUTHOR" \
                  'add // [] | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))
                   | group_by(.user.login) | map(last)
                   | .[] | select(.state == "APPROVED" and .commit_id == $head and .user.login != $author) | .user.login' 2>"$errf"); then
                lookup_error="could not read the PR's reviews: $(tr '\n' ' ' < "$errf")"
              else
                # Read line by line: an unquoted loop would glob a login like
                # `dependabot[bot]` against the PR's own filenames.
                while IFS= read -r login; do
                  [ -n "$login" ] || continue
                  if perm=$(gh api "repos/$REPO/collaborators/$login/permission" --jq .permission 2>"$errf" </dev/null); then
                    case "$perm" in admin|write) approvers+="${approvers:+ }$login" ;; esac
                  elif ! grep -q 'HTTP 404' "$errf"; then
                    # 404 means not a collaborator: not an approver. Anything
                    # else means we could not tell, which must not pass.
                    lookup_error="could not read $login's permission: $(tr '\n' ' ' < "$errf")"
                    break
                  fi
                done <<< "$candidates"
              fi
            fi
            if [ "${#reasons[@]}" -gt 0 ] && [ -z "$lookup_error" ] && [ -n "$approvers" ]; then
              echo "::notice::This PR changes what the secret scan accepts, and $(echo $approvers) approved it at $PR_HEAD: its own config applies."
              echo "Secret scan override approved by $(echo $approvers)." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              reasons=()
            else
              cfg=$(mktemp -d "${RUNNER_TEMP:-/tmp}/gitleaks-config.XXXXXX")
              if git cat-file -e "$base:.gitleaks.toml" 2>/dev/null; then git show "$base:.gitleaks.toml" > "$cfg/gitleaks.toml"
              else printf '[extend]\nuseDefault = true\n' > "$cfg/gitleaks.toml"; fi
              # gitleaks reads .gitleaksignore from the checkout whatever
              # --gitleaks-ignore-path says, so put the base's there (or none).
              rm -f .gitleaksignore
              if git cat-file -e "$base:.gitleaksignore" 2>/dev/null; then git show "$base:.gitleaksignore" > .gitleaksignore; fi
              scan+=(--config "$cfg/gitleaks.toml" --ignore-gitleaks-allow)
              # A relative `[extend] path` resolves from the working directory,
              # so run from a copy of the base tree: the PR can't edit the
              # file the base config extends.
              if awk '{ sub(/#.*/, ""); gsub(/[ \t]/, "") } /^\[/ { t = $0 } t == "[extend]" && /^path=/ { f = 1 } END { exit !f }' "$cfg/gitleaks.toml"; then
                mkdir "$cfg/base-tree"
                git archive "$base" | tar -x -C "$cfg/base-tree"
                run_dir="$cfg/base-tree"
              fi
            fi
          fi

          rc=0
          (cd "$run_dir" && gitleaks detect "${scan[@]}" --source "$src" --log-opts="$range --diff-merges=remerge --text") || rc=$?
          if [ "${#reasons[@]}" -gt 0 ]; then
            why=$(printf '%s; and ' "${reasons[@]}")
            msg="Secret scan override needs a person: this PR ${why%; and }. ${lookup_error:+The approval check itself failed ($lookup_error), so no approval could be counted. }A person with write access, other than the PR's author, must approve the PR at its current head ($PR_HEAD), then re-run this job. Until then the scan runs with the base branch's config and ignore file."
            echo "::error::$msg"
            echo "$msg" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi
          exit "$rc"

  node:
    # Node/TS repos only: gate skips this job for a repo with no package.json.
    # It fails instead when package.json is only in a subfolder (gate sets
    # node_error), so a moved project can't turn ci-ok green unchecked.
    needs: gate
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.gate.outputs.run_node == 'true' || needs.gate.outputs.node_error != '') }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - name: Find package.json
        if: ${{ needs.gate.outputs.node_error != '' }}
        env:
          NODE_ERROR: ${{ needs.gate.outputs.node_error }}
        run: |
          echo "::error::$NODE_ERROR"
          exit 1

      - uses: actions/checkout@v4

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          else echo "pm=npm" >> "$GITHUB_OUTPUT"; fi

      - if: steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.pm }}

      - name: Install
        id: install
        run: |
          if [ "${{ steps.pm.outputs.pm }}" = pnpm ]; then pnpm install --frozen-lockfile
          else npm ci; fi

      # Opt-in (gantry#19): runs the caller's codegen-command and fails when
      # the tree then differs from HEAD, i.e. the committed generated files are
      # stale. Comparing with HEAD, not with the tree before the command, means
      # an install hook that already regenerated them can't hide it. Staging
      # goes into a temporary index so the real one stays untouched for later
      # steps; that way a file the command adds counts as well as one it edits
      # or deletes, and gitignored output is left out because it isn't
      # committed. It runs right after Install, before lint and tests, so
      # their leftovers (coverage/, caches) aren't blamed on codegen. The command value is never echoed into an annotation, so a
      # multi-line value can't inject workflow commands.
      - name: Generated code is up to date
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          CODEGEN: ${{ inputs.codegen-command }}
        run: |
          if [ -z "$CODEGEN" ]; then
            echo "Skipped: no codegen-command given" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rc=0
          bash -eo pipefail -c "$CODEGEN" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::codegen-command failed (exit $rc)"
            exit 1
          fi
          # Seeded from the real index so git keeps its stat cache and only
          # hashes what changed.
          real_index=$(git rev-parse --git-path index)
          export GIT_INDEX_FILE
          GIT_INDEX_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/codegen-index.XXXXXX")
          trap 'rm -f "$GIT_INDEX_FILE"' EXIT
          cp "$real_index" "$GIT_INDEX_FILE"
          git add -A
          after=$(git write-tree)
          if [ "$after" != "$(git rev-parse 'HEAD^{tree}')" ]; then
            changed=$(git -c core.quotePath=false diff --name-status --no-renames HEAD "$after")
            echo "::error::Generated code is out of date: codegen-command changed committed files. Run it and commit the result."
            echo "$changed"
            { echo "Generated code is out of date. codegen-command changed:"; echo '```'; echo "$changed"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Generated code is up to date."

      # Every check below runs even if an earlier one failed, so one push
      # reports all failures (lint error AND failing test), not just the first.
      # The job still fails overall if any step fails. `!cancelled()` alone
      # would also run after a failed Install, so each check also requires
      # Install to have succeeded.
      - name: Lint
        id: lint
        run: |
          pm="${{ steps.pm.outputs.pm }}"
          if node -e 'process.exit(require("./package.json").scripts?.["lint:ci"] ? 0 : 1)'; then
            $pm run lint:ci
          elif node -e 'process.exit(require("./package.json").scripts?.lint ? 0 : 1)'; then
            $pm run lint
          else
            echo "Lint skipped: no lint:ci or lint script" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Skips when the repo has no `format:check` script. Catches unformatted
      # files (e.g. from gantry-init) before they turn main red.
      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pm="${{ steps.pm.outputs.pm }}"
          if node -e 'process.exit(require("./package.json").scripts?.["format:check"] ? 0 : 1)'; then
            $pm run format:check
          else
            echo "Format check skipped: no format:check script" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if [ -f tsconfig.json ]; then npx tsc --noEmit
          else echo "Typecheck skipped: no tsconfig.json" | tee -a "$GITHUB_STEP_SUMMARY"; fi

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pm="${{ steps.pm.outputs.pm }}"
          if node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            $pm run test
          else
            echo "Unit tests skipped: no test script" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dependency audit (high+)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if [ "${{ steps.pm.outputs.pm }}" = pnpm ]; then pnpm audit --audit-level high --prod
          else npm audit --audit-level=high --omit=dev; fi

      - name: E2E
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.e2e }}
        run: |
          npx playwright install --with-deps chromium
          ${{ steps.pm.outputs.pm }} run test:e2e

  # Single required status check: shows up in callers as `gantry / ci-ok`.
  # Fails if any job failed or was cancelled; success and skipped both pass.
  ci-ok:
    needs: [gate, secrets, node]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job ended as $r"; exit 1 ;;
            esac
          done
