# gantry daily secret scan. Call it from a repo on a schedule with:
#
#   on:
#     schedule:
#       - cron: "23 1 * * *"
#     workflow_dispatch:
#   jobs:
#     gantry:
#       uses: guangshinhaha/gantry/.github/workflows/secrets-scan.yml@main
#       permissions:
#         contents: read
#         issues: write
#
# ci.yml's secret scan checks only a PR's own commits, so a key on another branch
# or in old history can't turn an unrelated PR red (gantry#36). This scans every
# branch and all history once a day instead. It never blocks a PR: a leak turns
# this run red and opens one issue, or comments on it if it's already open.
#
# Why an issue: GitHub emails a scheduled run's failure only to the person who
# last changed its cron line, and only if their notification settings allow it.
# It also turns schedules off after 60 days without activity in a public repo.
# A new issue reaches everyone watching the repo.
name: gantry-secrets-scan

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'JSON runner label for the scan, e.g. "ubuntu-latest" or ["self-hosted","gantry"]'
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      result: ${{ steps.scan.outputs.result }}
    steps:
      # fetch-depth: 0 fetches every branch and tag, which is what this scans.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Downloads the gitleaks build for this runner's OS and arch and checks it
      # against a pinned sha256 (gantry#67). A gitleaks already on PATH is used
      # instead, and the log says so: a self-hosted runner may install its own,
      # and that's the only way to scan on a platform with no build here. Any
      # other platform fails with "unsupported platform", never a leak. bash, not
      # the default pwsh on Windows, so a Windows runner reaches that message.
      # Same step as in ci.yml, and a test keeps them the same.
      - name: Install gitleaks
        shell: bash
        run: |
          if command -v gitleaks >/dev/null; then
            echo "::notice::Using gitleaks already on PATH ($(command -v gitleaks), $(gitleaks version 2>/dev/null || echo 'version unknown')) instead of downloading v8.30.1"
          else
            version=8.30.1
            case "$RUNNER_OS/$RUNNER_ARCH" in
              Linux/X64)   platform=linux_x64;   sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
              Linux/ARM64) platform=linux_arm64; sha256=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
              macOS/X64)   platform=darwin_x64;  sha256=dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709 ;;
              macOS/ARM64) platform=darwin_arm64; sha256=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
              *)
                echo "::error::Secret scan not run: unsupported platform: $RUNNER_OS/$RUNNER_ARCH. gantry downloads gitleaks for Linux and macOS on X64 and ARM64 only; install gitleaks on this runner's PATH to scan here."
                exit 1 ;;
            esac
            dir=$(mktemp -d "${RUNNER_TEMP:-/tmp}/gitleaks.XXXXXX")
            tarball="gitleaks_${version}_${platform}.tar.gz"
            curl -sSfL -o "$dir/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
            if command -v sha256sum >/dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
            echo "$sha256  $dir/$tarball" | $sum -c -
            tar -xzf "$dir/$tarball" -C "$dir" gitleaks
            echo "$dir" >> "$GITHUB_PATH"
          fi
      # gitleaks also exits 1 on a bad config, so leaks get their own code (3).
      # Anything else is an error, and the issue says so instead of claiming a leak.
      - name: gitleaks (all branches, all history)
        id: scan
        shell: bash
        run: |
          branches=$(git for-each-ref --format='%(refname)' refs/remotes | grep -cv '/HEAD$' || true)
          echo "Secret scan: $(git rev-list --count --all) commit(s) across $branches branch(es)" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          rc=0
          gitleaks detect --redact --verbose --exit-code 3 --log-opts=--all || rc=$?
          case "$rc" in
            0) echo "result=clean" >> "$GITHUB_OUTPUT" ;;
            3) echo "result=leaks" >> "$GITHUB_OUTPUT"
               echo "::error::gitleaks found a key on a branch or in history. Revoke it, then remove it."
               exit 1 ;;
            *) echo "result=error" >> "$GITHUB_OUTPUT"
               echo "::error::gitleaks exited $rc, so the scan did not finish."
               exit "$rc" ;;
          esac

  # A separate job so the token that can write issues never runs gitleaks or
  # sees the checkout. Runs only when the scan failed for any reason.
  alert:
    needs: scan
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # bash for pipefail: a failed issue lookup must fail the step, not open
      # a second issue.
      - name: Open or update the alert issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.scan.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="gantry: the daily secret scan failed"
          if [ "$RESULT" = leaks ]; then
            what="gitleaks found a key on a branch or in the history of this repo."
            todo="Revoke the key first: deleting the commit doesn't make it safe, because anyone with a clone has it. Then remove it from the branch, or rewrite history, and re-run the scan."
          else
            what="The scan did not finish, so this repo's branches weren't checked for keys today."
            todo="Open the run to see why, fix it, and re-run the scan."
          fi
          # Finding details stay in the run log, not in an issue that may be public.
          body=$(printf '%s\n\n%s\n\nRun: %s\n\nClose this issue once the scan passes again.' "$what" "$todo" "$RUN_URL")
          # The REST list, not search, so an issue opened seconds ago is found.
          number=$(gh api --paginate "repos/$REPO/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            --jq ".[] | select(.pull_request == null and .title == \"$title\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh api "repos/$REPO/issues/$number/comments" -f body="$body" --jq .html_url
            echo "Commented on #$number" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            url=$(gh api "repos/$REPO/issues" -f title="$title" -f body="$body" --jq .html_url)
            echo "Opened $url" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
