# gantry/node — JS/TS projects. Each check skips itself if the repo
# lacks the script/config, so it is safe to include everywhere.
#
# The pre-push checks run bin/gantry-check from lefthook's copy of this remote,
# the same script CI's node job runs, so the hook and CI can't drift apart
# (gantry#125). lefthook clones the remote to info/lefthook-remotes/gantry-<ref>
# under the git dir; template/lefthook.yml uses ref main.

pre-commit:
  commands:
    gantry-lint-staged:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: |
        [ -f node_modules/.bin/eslint ] || exit 0
        node_modules/.bin/eslint --no-warn-ignored {staged_files}

pre-push:
  commands:
    gantry-format:
      priority: 0
      run: sh "$(git rev-parse --git-path info/lefthook-remotes)/gantry-main/bin/gantry-check" format

    gantry-typecheck:
      priority: 1
      run: sh "$(git rev-parse --git-path info/lefthook-remotes)/gantry-main/bin/gantry-check" typecheck

    gantry-test:
      priority: 2
      run: sh "$(git rev-parse --git-path info/lefthook-remotes)/gantry-main/bin/gantry-check" test

    gantry-audit:
      priority: 3
      run: sh "$(git rev-parse --git-path info/lefthook-remotes)/gantry-main/bin/gantry-check" audit
