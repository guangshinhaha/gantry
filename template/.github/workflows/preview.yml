name: preview
# Smoke-tests each PR's preview deployment (Playwright tests tagged @smoke).
# platform is railway or vercel. Skips itself (with a visible "Skipped: reason" in the job summary) when the platform
# secret (Railway) or @smoke tests are missing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md"]
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: ${{ !github.event.pull_request.draft }}
    uses: guangshinhaha/gantry/.github/workflows/preview.yml@main
    with:
      platform: __PLATFORM__ # gantry-init fills this in (railway or vercel)
      # gantry:optional
      # lighthouse: true            # report-only scan after smoke passes
      # lighthouse-urls: "/ /login"  # paths to scan (default /)
      # lighthouse-min-a11y: 90     # fail below this accessibility score
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      deployments: read
