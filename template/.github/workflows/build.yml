name: build
# Docker build-and-verify (GHA cache), never pushes. Northflank, Railway and
# Vercel build the image themselves; only AWS apps push to ECR.
# Added by `gantry-init --docker`. Skips itself, visibly, without a Dockerfile.
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    uses: guangshinhaha/gantry/.github/workflows/build.yml@main
    # gantry:optional
    # with:
    #   run-image: true        # smoke test: run the image, wait for health, check probes
    #   port: 3000             # the port the container listens on
    #   health-path: /health
    #   probes: |
    #     / 200
    #     /missing.js 404
    permissions:
      contents: read
